<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dapur Kilat — Game Memasak</title>
<style>
  html, body { margin: 0; padding: 0; background: #2b1a12; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Segoe UI", Verdana, sans-serif; }
  #wrap { position: relative; width: 1280px; height: 720px; box-shadow: 0 0 60px rgba(0,0,0,.6); }
  canvas { display: block; width: 1280px; height: 720px; background: #f7e8c9; cursor: pointer; }
  #hint {
    position: absolute; left: 0; right: 0; bottom: -26px; text-align: center;
    color: #d8c9a8; font-size: 13px; letter-spacing: .4px;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hint">Klik bahan di counter &middot; 1&ndash;7 bahan &middot; Spasi: masak &middot; Enter: sajikan &middot; Del: buang &middot; R: mulai lagi</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
